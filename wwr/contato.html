<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Rafting</title>
    <meta name="description" content="Fale conosco">
    <meta name="author" content="Iracema Andrade Valente">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="imagens/logo-rafting.png" alt="Logo Rio Abaixo Rafting">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="passeios.html">Passeios</a></li>
                    <li><a href="contato.html">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <article>
                <p>123 Rua Principal do Rio</p>
                <p>Foz do Iguaçu, Paraná</p>
                <p>+55 45 99999-9999</p>
                <p>info@correiras.com</p>
            </article>
        </div>

        <form>
            <fieldset>
                <div class="item-formulario coluna2">
                    <label for=" nome-usuario">Nome</label>
                    <input type="text" id="nome-usuario" name="nome-usuario">
                </div>
                <div class="item-formulario coluna2">
                    <label for="email-do-usuario">E-mail:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>
            <fieldset>
                <div class="item-formulario coluna1">
                    <label for="navegador">Propósito da Mensagem</label>
                    <select id="navegador" name="navegador">
                        <option value="duvida">Dúvida Geral</option>
                        <option value="pergunta">Pergunta sobre Reserva</option>
                        <option value="sugestao">Sugestão</option>
                    </select>
                </div>

                <div class="item-formulario coluna2">
                    <label for="feedback" class="label-central">Mensagem</label>
                    <textarea id="feedback" name="feedback" rows="4"
                      placeholder="Digite aqui"></textarea>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Por favor, me escreva na newsletter mensal</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
            </fieldset>

            <button type="submit">Entrar em Contato!</button>

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d193782.59820574915!2d-54.53921030054449!3d-25.51356810655979!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1785453924910!5m2!1spt-BR!2sbr"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

        </form>
        </section>
        <section class="aventura">
            <h2>Estamos Aqui para Serví-lo</h2>
            <div class="galeria-aventura">
                <figure>
                    <img src="imagens/rafting4.jpg" alt="Diversão com amigos">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting5.jpg" alt="Muita Adrenalina">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure>
                    <img src="imagens/rafting6.jpg" alt="Desafiando limites">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 🍀Iracema Valente🍀 São Bernardo - SP</p>
        <nav class="sicialmedia">
            <a href="https://facebook.com" target="_blank"><img src="imagens/facebook.svg"
                  alt="Página Facebook"></a>
            <a href="https://linkedin.com"><img src="imagens/linkedin.svg"
                  alt="Página Linkedin"></a>
            <a href="https://instagram.com"><img src="imagens/instagram.svg"
                  alt="Página Instagram"></a>
        </nav>
    </footer>
</body>

</html>

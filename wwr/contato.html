<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato-Rafting</title>
    <meta name="description" content="Fale conosco">
    <meta name="author" content="Iracema Andrade Valente">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="imagens/logo-rafting.png" alt="Logo Rio Abaixo Rafting">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="passeios.html">Passeios</a></li>
                    <li><a href="contato.html">Fale Conosco</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="info-contato">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p><a href="mailto:info@correiras.com">info@correiras.com</a></p>
        </section>

        <section class="contato-container">
            <div class="mapa">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d193782.59820574915!2d-54.53921030054449!3d-25.51356810655979!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e0!3m2!1spt-BR!2sbr!4v1785453924910!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>


            <form class="form-contato">
                <label for="nome-usuario">Nome</label>
                <input type="text" id="nome-usuario" name="nome-usuario" placeholder="Digite aqui">

                <label for="email-do-usuario">E-mail:</label>
                <input type="email" id="email-do-usuario" name="email-do-usuario"
                  placeholder="Digite aqui">

                <p>Propósito da Mensagem</p>
                <div class="radio-group">
                    <label><input type="radio" name="proposito" value="duvida" checked>Duvida
                        Geral</label>
                    <label><input type="radio" name="proposito" value="reserva">Pergunta sobre
                        Reserva</label>
                    <label><input type="radio" name="proposito" value="sugestao">Sugestão</label>
                </div>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter">Por favor, me escreva na newsletter
                    mensal
                </label>

                <button type="submit">Entrar em Contato!</button>

            </form>
        </section>
        <section class="funcionarios">
            <h2>Estamos Aqui para Servi-lo</h2>
            <div class="perfis">
                <figure>
                    <img src="imagens/funcionario1.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure>
                    <img src="imagens/funcionario2.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
                <figure>
                    <img src="imagens/funcionario3.jpg" alt="Perfil do Funcionário">
                    <figcaption>Perfil do Funcionário</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 🍀Iracema Valente🍀 São Bernardo - SP</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="imagens/facebook.svg"
                  alt="Página Facebook"></a>
            <a href="https://linkedin.com" target="_blank"><img src="imagens/linkedin.svg"
                  alt="Página Linkedin"></a>
            <a href="https://instagram.com" target="_blank"><img src="imagens/instagram.svg"
                  alt="Página Instagram"></a>
        </nav>
    </footer>
</body>

</html>
